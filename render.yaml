services:
  - type: web
    name: trippy-research
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bridge_server.py
    healthCheckPath: /api/status
    envVars:
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_AGENT_ENDPOINT
        sync: false
      - key: AZURE_AGENT_NAME
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_DEPLOYMENT_LUNA
        sync: false
      - key: AZURE_DEPLOYMENT_SOL
        sync: false
      - key: TRIPPY_BRIDGE_TOKEN
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Required by the staged planner; set explicit values in Render Environment.
      - key: TRIPPY_ALLOW_PAID_RESEARCH
        sync: false
      - key: TRIPPY_AI_BUDGET_AMOUNT
        sync: false
      - key: TRIPPY_AI_BUDGET_CURRENCY
        sync: false
      - key: TRIPPY_LUNA_INPUT_PER_MILLION
        sync: false
      - key: TRIPPY_LUNA_OUTPUT_PER_MILLION
        sync: false
      - key: TRIPPY_WEB_RESERVATION_PER_CALL
        sync: false
      - key: TRIPPY_SHARED_BUDGET_LEDGER
        sync: false
      # Admin dashboard (/admin): its own token, never the app's; 24+ random characters.
      - key: TRIPPY_ADMIN_TOKEN
        sync: false
      # Postgres for the dashboard's stats and admin controls (e.g. Supabase session pooler URL).
      - key: TRIPPY_STATS_DATABASE_URL
        sync: false
